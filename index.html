<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Security Headers -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <title>Snake Game</title>
    <script>
      /*
       * REF-07 Phase B — FOWT (flash-of-wrong-theme) guard.
       *
       * Runs synchronously before the CSS bundle loads so the `:root[data-theme]`
       * selector in src/styles/tokens.css matches on the very first paint.
       *
       * Mirrors the canonical logic in src/utils/themeBoot.ts::resolveBootTheme.
       * Kept intentionally small (no ESM, no TS, IIFE + try/catch) so it cannot
       * throw at boot under any storage / matchMedia / iframe scenario.
       */
      (function () {
        try {
          var raw = localStorage.getItem('snake-game-theme');
          var theme = raw === 'dark' || raw === 'light' || raw === 'auto' ? raw : 'dark';
          var effective =
            theme === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          document.documentElement.setAttribute('data-theme', effective);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
